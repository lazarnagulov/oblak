version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: oblak_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin-sifra}
      POSTGRES_DB: ${DB_NAME:-baza}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

minio:
    image: minio/minio:latest
    container_name: oblak_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-oblak_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-admin-sifra}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: