basePath: /api/v1
definitions:
  ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
    type: object
  FunctionListResponse:
    properties:
      name:
        example: my-api-handler
        type: string
      runtime:
        example: python3.10
        type: string
    type: object
  FunctionResponse:
    properties:
      created_at:
        example: "2026-05-22T12:00:00Z"
        type: string
      handler:
        example: handler
        type: string
      id:
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        type: string
      memory:
        example: 128
        type: integer
      module:
        example: main
        type: string
      name:
        example: my-api-handler
        type: string
      runtime:
        example: python3.10
        type: string
      timeout:
        example: 10
        type: integer
    type: object
  LoginRequest:
    properties:
      password:
        description: '@Param password example true "supersecure123"'
        example: supersecure123
        type: string
      username:
        description: '@Param username example true "john"'
        example: john
        type: string
    required:
    - password
    - username
    type: object
  LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      username:
        example: john
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API for the Oblak Serverless platform.
  title: Oblak Serverless API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using credentials and returns an API token.
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successful login
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: User login
      tags:
      - auth
  /functions/:
    get:
      description: Retrieves a list of all deployed functions belonging to the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: List of functions
          schema:
            items:
              $ref: '#/definitions/FunctionListResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List functions
      tags:
      - functions
  /functions/{name}:
    delete:
      description: Deletes a function from the database and removes its artifact from
        the storage.
      parameters:
      - description: Function name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Function not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Failed to delete artifact or database record
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a function
      tags:
      - functions
    get:
      description: Retrieves detailed information about a specific function by its
        name.
      parameters:
      - description: Function name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Function details
          schema:
            $ref: '#/definitions/FunctionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Function not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get function details
      tags:
      - functions
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
